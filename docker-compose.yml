services:
  postgres:
    image: postgres:17-alpine
    container_name: bank_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  bank-api:
    build: .
    container_name: bank_api
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/bank?sslmode=disable
      JWT_SECRET: super-secret-key-2026
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data: